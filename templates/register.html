{% extends 'layout.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<h1>Welcome to TrekCentral</h1>
<br>
<h2>Register your account by filling out the form below:</h2>

<form method="POST" action="">
    <div>
        <label for="username" class="form-label">Select a Username:</label>
        <input type="text" id="username" name="username" class="form-control" required><br>
    </div>
    <div>
        <label for="fullname" class="form-label">Full Name:</label>
        <input type="text" id="fullname" name="fullname" class="form-control" required><br>
    </div>
    <div>
        <label for="phone" class="form-label">Phone Number:</label>
        <input type="number" id="phone" name="phone" class="form-control" required><br>
    </div>
    <div>
        <label for="password" class="form-label">Password:</label>
        <input type="password" id="password" name="password" class="form-control" required><br>
    </div>
    <div class="form-label">
        <label for="cpassword" class="form-label">Confirm Password:</label>
        <input type="password" id="cpassword" name="cpassword" class="form-control" required><br>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
</form>
<br
<p>Already have an account? <a href="{{ url_for('login') }}" class="btn btn-secondary">Login here</a>.</p>
{% endblock %}
