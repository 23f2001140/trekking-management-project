{% extends "layout.html" %}

{% block title %}Admin Profile{% endblock %}

{% block content %}
<h1>Edit Profile</h1>
<h4>Hello, {{ current_user.fullname }}!</h4>
<form class="row g-3" method="POST">
  <div class="col-md-6">
    <label for="username" class="form-label"><strong>Username</strong></label>
    <input type="text" class="form-control" id="username" name="username" value="{{ current_user.username }}">
  </div>
  <div class="col-md-6">
    <label for="fullname" class="form-label"><strong>Full Name</strong></label>
    <input type="text" class="form-control" id="fullname" name="fullname" value="{{ current_user.fullname }}">
  </div>
  <div class="col-6">
    <label for="phone" class="form-label"><strong>Phone Number</strong></label>
    <input type="text" class="form-control" id="phone" name="phone" value="{{ current_user.phone }}">
  </div>
  <div class="col-8">
    <label for="cpassword" class="form-label"><strong>Enter your Current Password</strong></label>
    <input type="password" class="form-control" id="cpassword" name="cpassword">
  </div>
    <div class="col-8">
    <label for="password" class="form-label"><strong>Enter your New Password</strong></label>
    <input type="password" class="form-control" id="password" name="password">
  </div>
   <div class="col-8">
    <label for="confirm_password" class="form-label"><strong>Confirm your New Password</strong></label>
    <input type="password" class="form-control" id="confirm_password" name="confirm_password">
  </div>
  <br>
  <br>
  <div class="col-6">
    <button type="submit" class="btn btn-primary">Update Profile</button>
  </div>
    <div class="col-6">
    <a class="btn btn-danger mb-3" href="{{ url_for('logout') }}">Logout</a>
  </div>
</form>
{% endblock %}
